name: Build documentation

on: [push, pull_request]

permissions:
  contents: read

# Cancel ongoing builds on new changes
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Run tasks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: uv run poe build-docs

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-output
          path: doc/_build/html
          include-hidden-files: true

      # The "Publish documentation (Pull Request)" workflow picks up the
      # artifacts of this run and uploads the HTML to a preview location.
      - name: Record the pull request number
        if: github.event_name == 'pull_request'
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          echo "${PR_NUM}" > pr_num
          {
            echo "The documentation for this pull request will be available shortly at:"
            echo ""
            echo "https://builds.zephyrproject.io/west/pr/${PR_NUM}/doc/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pull request number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr_num
          path: pr_num
