name: Publish documentation

# Runs after a successful "Build documentation" run on a release branch, in
# the context of the base repository so the AWS credentials are available.
on:
  workflow_run:
    workflows: ["Build documentation"]
    branches:
      - main
      - v*-branch
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'zephyrproject-rtos/west'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download HTML output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: html-output
          path: html-output/html
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ vars.AWS_DOCS_WEST_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DOCS_WEST_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to AWS S3
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${HEAD_BRANCH}" = "main" ]; then
            VERSION="latest"
          else
            # vX.Y-branch -> X.Y
            VERSION="${HEAD_BRANCH#v}"
            VERSION="${VERSION%-branch}"
          fi

          aws s3 sync --quiet html-output/html "s3://docs.zephyrproject.org/west/${VERSION}" --delete
