[build-system]
requires = ["maturin>=1.7,<2.0"]
# Custom PEP 517 wrapper around maturin's backend. The wrapper
# pre-builds the CLI binary via `cargo build --features pyo3` and
# stages it where maturin's `[tool.maturin] data` directive can pick
# it up, so a vanilla `pip install .` ends up with both the python
# extension AND the `west` binary on PATH. See `_build_backend.py`
# for details and the link to PyO3/maturin#368 (the upstream gap
# this works around).
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "west"
# Sourced from `[workspace.package] version` in the root Cargo.toml.
# Maturin populates this from `cargo metadata` during build; the
# `_build_backend.py` wrapper re-exports maturin's
# `prepare_metadata_for_build_wheel` (and the editable variant)
# unchanged, so both `pip install .` and `pip install -e .` end up
# with the right version. Bump in Cargo.toml, not here.
dynamic = ["version"]
authors = [{name = "Zephyr Project", email = "devel@lists.zephyrproject.org"}]
description = "Zephyr RTOS Project meta-tool"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/zephyrproject-rtos/west"

# Maturin builds `crates/west-cli` with the `pyo3` feature, which
# turns the crate into a hybrid:
#  - the `[[bin]] name = "west"` target → the CLI binary, shipped at
#    `<wheel>/west-<version>.data/scripts/west` (pip installs it onto
#    PATH; no python entry-point shim needed).
#  - the `[lib] crate-type = ["cdylib", "rlib"]` target → the
#    `_west_native` python extension module, packaged into the wheel's
#    python package so `from _west_native import ...` works after
#    `pip install west`.
# Both come from the same Cargo workspace, the same `cargo build`
# pass, and ship in one wheel.

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/west-cli/Cargo.toml"
# Force the `pyo3` feature so the cdylib actually populates the
# `_west_native` module. Without this, `bindings = "pyo3"` would
# build an empty cdylib (the `#[pymodule]` is feature-gated).
features = ["pyo3"]
# In maturin's mixed Python/Rust layout, the rust extension is placed
# as a SUBMODULE of the python package — `<wheel>/west/_west_native.abi3.so`
# rather than a top-level `_west_native.abi3.so`. Callers therefore use
# `from west._west_native import ...` to reach the binding. The dotted
# name's last component must match the `#[pymodule] fn _west_native`
# exported symbol.
module-name = "west._west_native"
# The python sources live in src/west/ (the established layout).
# Maturin picks up everything under src/ as the python package.
python-source = "src"
# Wheel data dir. Files under `.wheel-data/scripts/` end up at
# `<wheel>/west-VERSION.data/scripts/`, which pip installs to PATH
# (PEP 427). The CLI binary belongs here. The `.wheel-data/` directory
# is populated by `_build_backend.py` before maturin runs — maturin
# can't trigger an additional `cargo build --bin` itself in
# `bindings = "pyo3"` mode (issue PyO3/maturin#368).
data = ".wheel-data"
# Pull `py.typed` (PEP 561 marker) into both sdist and wheel —
# maturin's default file discovery would skip it.
include = [
    { path = "src/west/py.typed", format = ["sdist", "wheel"] },
]
# Pass `--locked` to cargo: forbid lockfile mutation during the build
# and SHA-256-verify every fetched crate against `Cargo.lock`. Pins
# exact transitive versions for sdist-from-source installs (`pip
# install west` when no matching wheel exists) and blocks a hijacked
# registry from substituting a tampered crate.
#
# Not `frozen = true`: that implies `--offline`, which fails on any
# machine whose cargo registry cache hasn't already seen our deps —
# i.e. every first-time end-user install. Checksums already give the
# supply-chain guarantee; offline-only just hurts UX.
locked = true

[dependency-groups]
build = [
    "maturin>=1.7,<2.0",
]
lint = [
    "ruff~=0.13",
]
test = [
    "coverage~=7.10",
    "pytest>=8.4,<10.0",
    "pytest-cov~=7.0",
    "pytest-xdist>=3",
    "pyyaml~=6.0",
    # `tomllib` is stdlib (3.11+), but only handles reads; the
    # parametric manifest_format fixture needs to write TOML too.
    "tomli-w~=1.0",
    # `tomllib` backport — `tomli` is the upstream code stdlib
    # vendored as `tomllib` in 3.11+. Only installed on 3.10 where
    # stdlib `tomllib` is unavailable; `conftest.py` aliases it on
    # import.
    "tomli~=2.0; python_version < '3.11'",
]
types = [
    "mypy~=1.18",
]
dev = [
    "poethepoet~=0.37",
    {include-group = "build"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "types"},
]

# Note this section is only for interactive `coverage run ...` use and ignored by "gh-test"
# below.  pytest's --cov-config= option is for passing .coveragerc file syntax and it seems to
# silently ignore pyproject.toml files.
[tool.coverage.run]
patch = ["subprocess"]
relative_files = true
source = ["src/"]

[tool.coverage.paths]
source = [
  "src/west",
  "*/site-packages/west",
  "*/src/west",
]

[tool.ruff]
line-length = 100
# Carry-over tests from before the rust port. They migrate into
# `tests/` one by one; until each lands there's no value in
# linting code that's about to be rewritten or deleted.
extend-exclude = ["tests-legacy"]

[tool.ruff.lint]
extend-select = [
  "B",   # flake8-bugbear
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.isort]
# tomllib _is_ a standard library for Python 3.11+
extra-standard-library = ["tomllib"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "lf"
# Enable preview mode for Github Annotations added in 0.13.3
preview = true

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
# You can override any pytest option via pytest argument `-o key=value`.
# E.g. unset option `-o pythonpath=` to use the installed west in tests
pythonpath = "src"
# Active test root. `tests-legacy/` sits alongside as the
# carry-over from removing the python CLI driver; its
# `conftest.py` still imports the gone `west.app` module and
# would error at collection time. Restricting discovery to
# `tests/` keeps the active suite green while individual legacy
# files migrate over.
testpaths = ["tests"]

# Build the rust artifacts the test suite needs:
#   - `target/release/west` — the CLI binary. `tests/conftest.py`
#     spawns this directly (NOT via `python -m west`), and prefers the
#     release build over the debug one. Build the bin target only,
#     and without the `pyo3` feature — see note below.
#   - `_west_native.abi3.so` — the PyO3 extension that `west.manifest`
#     and friends import. `maturin develop` builds this (the cdylib)
#     and installs it into the active venv.
#
# Why `--bin west` (not `-p west-cli`) and no `--features pyo3` on
# step 1: maturin's cargo invocation runs with
# `PYO3_BUILD_EXTENSION_MODULE=1` plus pyo3's extension-module
# linkage, which produces a different build fingerprint for the
# cdylib than a plain `cargo build --features pyo3`. If both
# invocations touch the cdylib they thrash each other's cache. Build
# *only* the bin here and let maturin own the cdylib.
#
# Cargo is incremental so the no-op case is cheap; tasks that depend
# on either artifact should declare `deps = ["build"]`. The CI
# `gh-test` task intentionally skips this — CI builds via
# `pip install .` (which goes through the maturin build backend) and
# would double-build if `build` were chained.
[tool.poe.tasks.build]
sequence = [
    {cmd = "cargo build --release -p west-cli --bin west"},
    # Maturin compiles the cdylib with `--features pyo3` and
    # `PYO3_BUILD_EXTENSION_MODULE=1`; cargo's fingerprint for the
    # west-cli lib then differs from the bin build above, causing
    # cross-invalidation on every alternation. Pin maturin to its own
    # target dir so the two cargo worlds keep their fingerprints
    # apart. Costs a few hundred MB of disk; in exchange a no-source-
    # change rerun finishes in well under a second.
    {cmd = "maturin develop --release --uv", env = {CARGO_TARGET_DIR = "target/maturin"}},
]

[tool.poe.tasks.test]
cmd = "python -m pytest -W error"
env = {PYTHONIOENCODING = "utf-8"}
deps = ["build"]

[tool.poe.tasks.test-xdist]
ref = "test -n auto"

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format"
types = "mypy --package west"
# work in progress
types-extra = "mypy --package west --check-untyped-defs"

all = ["test", "lint", "format", "types"]

# Github specific tasks, see comments in .github/workflows/*.yml
gh-lint = "ruff check --output-format=github ."
gh-format = "ruff format --check --output-format=github"

[tool.poe.tasks.gh-test]
# Keep the --cov= option in sync with [tool.coverage.run] above.
cmd = "python -m pytest -W error -v -o pythonpath= -o junit_family=xunit1 --junitxml=junit.xml --cov-report=html --cov=src/"
env = {PYTHONIOENCODING = "utf-8"}
