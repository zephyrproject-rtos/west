[package]
name = "west-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# `cdylib` is what maturin packages as the `_west_native` python
# extension module; `rlib` is what `src/bin/west.rs` consumes. The
# python module is feature-gated so `cargo install west-cli` from
# crates.io (no `pyo3` feature) builds the CLI binary without the
# pyo3 toolchain or libpython at all.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pulls in pyo3 itself; the structured-data serializer/deserializer
# crates (serde_json, serde_yaml_ng, toml_edit) are unconditional
# dependencies of west-cli because the `west manifest --resolve` /
# `--freeze` subcommand needs them. The CLI binary therefore always
# ships with the three serde frontends — they're small.
pyo3 = ["dep:pyo3", "dep:pyo3-log"]

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.15"
env_logger = "0.11"
indicatif = "0.17"
log = "0.4"
md-5 = "0.10"
rayon = "1"
shlex = "1"
strfmt = "0.2"
thiserror.workspace = true
west-core = { path = "../west-core" }

# Only pulled in when the `pyo3` feature is enabled (i.e., when maturin
# is building the python wheel).
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"], optional = true }
# Bridges rust `log::*` records into python's `logging` module —
# `log::warn!(target: "west.manifest", ...)` from west-core ends up on
# `logging.getLogger("west.manifest")` after `pyo3_log::Logger::install()`
# is called once at module init.
pyo3-log = { version = "0.13", optional = true }
# Structured-data serializers used by both `west manifest --resolve` /
# `--freeze` (binary) and `_west_native.parse_*` / `dump_*` (python
# binding). `serde_json` and `toml_edit` are also pulled in transitively
# by west-core; listing them here pins the same versions for west-cli's
# own use. `serde_yaml_ng` is the maintained successor to the
# now-unmaintained `serde_yaml`.
# `preserve_order` mirrors the feature west-core enables; cargo
# unifies features per-crate so dropping it here would only matter
# if cargo ever stopped doing that. Belt-and-braces.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml_edit = { version = "0.22", features = ["serde"] }

[build-dependencies]
# Small dep, always included so the build script can call
# `pyo3_build_config::add_extension_module_link_args()` when the
# `pyo3` feature is active. macOS in particular needs
# `-undefined dynamic_lookup` for the cdylib to leave python symbols
# resolvable at runtime (maturin sets this itself when invoked
# directly; plain `cargo build --features pyo3` does not).
pyo3-build-config = "0.28"

[dev-dependencies]
assert_cmd = "2"
serial_test = "3"
tempfile = "3"

[[bin]]
name = "west"
