[package]
name = "west-cli"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# `cdylib` is what maturin packages as the `_west_native` python
# extension module; `rlib` is what `src/bin/west.rs` consumes. The
# python module is feature-gated so `cargo install west-cli` from
# crates.io (no `pyo3` feature) builds the CLI binary without the
# pyo3 toolchain or libpython at all.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Pulls in pyo3 + the structured-data serializers/deserializers needed
# by the python binding. The CLI binary doesn't need any of these for
# its own work; `cargo install west-cli` builds a clean binary with
# no python toolchain involved.
pyo3 = ["dep:pyo3", "dep:serde_json", "dep:serde_yaml_ng", "dep:toml_edit"]

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.15"
env_logger = "0.11"
indicatif = "0.17"
log = "0.4"
md-5 = "0.10"
rayon = "1"
shlex = "1"
strfmt = "0.2"
thiserror.workspace = true
west-core = { path = "../west-core" }

# Only pulled in when the `pyo3` feature is enabled (i.e., when maturin
# is building the python wheel).
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"], optional = true }
# Structured-data serialization for the python `_west_native.parse_*`
# / `dump_*` bindings. west-core already pulls in `serde_json` and
# `toml_edit` transitively; we list them here explicitly with
# `optional = true` so Cargo's feature unifier keeps them out of the
# non-pyo3 build path. `serde_yaml_ng` (the maintained successor to
# `serde_yaml`) is the only new dep.
serde_json = { version = "1", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
toml_edit = { version = "0.22", features = ["serde"], optional = true }

[build-dependencies]
# Small dep, always included so the build script can call
# `pyo3_build_config::add_extension_module_link_args()` when the
# `pyo3` feature is active. macOS in particular needs
# `-undefined dynamic_lookup` for the cdylib to leave python symbols
# resolvable at runtime (maturin sets this itself when invoked
# directly; plain `cargo build --features pyo3` does not).
pyo3-build-config = "0.28"

[dev-dependencies]
assert_cmd = "2"
serial_test = "3"
tempfile = "3"

[[bin]]
name = "west"
