[package]
name = "west-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
dirs = "5"
garde = { version = "0.20", features = ["derive", "regex"] }
log = "0.4"
# Pure-string `.`/`..` collapsing for paths from manifest YAML. We
# never want `std::fs::canonicalize` here — manifest paths must
# resolve as written, regardless of what's on disk in any given
# workspace.
path-clean = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.26"
# `preserve_order` makes `serde_json::Map` keep insertion order. The
# manifest serializer (`Manifest::to_value`) inserts fields in v1's
# NURPCW shape (name → description → url → revision → path → …);
# without this feature the default BTree-like ordering would emit
# them alphabetically, which v1-compat tests reject.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror.workspace = true
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
serial_test = "3"
