[manifest]
version = "1.2"
group-filter = ["-optional", "+core"]

[[manifest.remotes]]
name = "upstream"
url-base = "https://github.com/zephyrproject-rtos"

[[manifest.remotes]]
name = "nrf"
url-base = "https://github.com/nrfconnect"

[manifest.defaults]
remote = "upstream"
revision = "main"

[manifest.self]
path = "manifest"
west-commands = "scripts/west-commands.yml"

[[manifest.projects]]
name = "zephyr"
groups = ["core"]

[[manifest.projects]]
name = "hal_nordic"
remote = "nrf"
revision = "nordic-fixes"
path = "modules/hal/nordic"
clone-depth = 1
groups = ["hal", "core"]

[[manifest.projects]]
name = "hal_st"
remote = "upstream"
repo-path = "hal_st"
path = "modules/hal/st"
groups = ["hal", "optional"]

[[manifest.projects]]
name = "vendor-thing"
url = "https://git.example.com/vendor-thing.git"
revision = "v2.0.0"
path = "vendor/thing"
west-commands = "west-commands.yml"
submodules = true

[[manifest.projects]]
name = "with-explicit-submodules"
revision = "main"
path = "subs"
submodules = [
    { path = "deep/sub" },
    { path = "other/sub", name = "my-sub-name" },
]

[[manifest.projects]]
name = "no-submodules-explicit"
path = "nosubs"
submodules = false
userdata = { any = "thing", nested = { deeply = "ok" } }
