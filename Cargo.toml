[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Single source of truth for the project version. Both crates
# (`west-core`, `west-cli`) inherit via `version.workspace = true`;
# `pyproject.toml` declares `dynamic = ["version"]` and maturin
# reads this through `cargo metadata` at build time. Bump here,
# nowhere else.
version = "2.0.0-alpha1"
edition = "2024"
rust-version = "1.93.0"
repository = "https://github.com/zephyrproject-rtos/west"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"

# Release tuned for distribution size. The `west` binary is shipped
# inside the maturin wheel + via `cargo install`, so build time is
# paid once by us and download/disk space is what end users feel.
# `lto = "fat"` cross-crate inlines and dead-strips; `codegen-units
# = 1` gives LTO the full picture to chew on. Costs ~2-3× release
# build time.
[profile.release]
lto = "fat"
codegen-units = 1
